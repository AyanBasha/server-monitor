<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8"/>
        <title>Add Service - Server Monitor</title>
    </head>
    <body>
        <h2>Add a Service</h2>
        <!-- name="" is the key Go reads with r.FormValue("...") -->
        <form method="POST" action="/form">
            <p>
                <label for="name">Name</label>
                <input id="name" name="name" type="text" placeholder="Jellyfin" required/>
            </p>
            <p>
                <label for="url">URL</label>
                <input id="url" name="url" type="text" placeholder="http://192.168.5.14:8096" required/>
            </p>
            <input type="submit" value="Add service"/>
        </form>
        <p><a href="/">Home</a> · <a href="/dashboard">Dashboard</a></p>
    </body>
</html>
