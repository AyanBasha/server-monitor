<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8"/>
        <title>Dashboard - Server Monitor</title>
    </head>
    <body>
        <h2>Dashboard</h2>

        <ul>
            {{range .}}
            <li>
                <a href="{{.Service.URL}}" target="_blank">{{.Service.Name}}</a>

                <details>
                    <summary>info</summary>
                        <form method="POST" action="/edit">
                            <input type = "hidden" name="ID" value = "{{.Service.ID}}"/>
                            <label>Name <input name="name" type="text" value="{{.Service.Name}} required"/></label>
                            <label>URL  <input name="url" type="text" value="{{.Service.URL}} required"/></label>
                            <label>
                                <input type="checkbox" name="skipTLS" {{if .Service.SkipTLSVerify}}checked{{end}}/>
                                Self-signed certificate
                            </label>
                            <button type="submit">Save</button>
                        </form>
                   
                </details>

                <details>
                    <summary>{{.Status}}</summary>
                    {{.Message}}
                </details>

                <form method="POST" action="/delete">
                    <input type="hidden" name="ID" value="{{.Service.ID}}"/>
                    <button type="submit">Delete</button>
                </form>
            </li>
            {{else}}
                <li><a href="/form">Add a service</a></li>
            {{end}}

        </ul>

        <p><a href="/form">Add a service</a></p>
    </body>
</html>
