root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/main ./src"
  entrypoint = ["./tmp/main"]
  include_ext = ["go", "html", "json"]
  exclude_dir = ["tmp", "static", ".git"]
  exclude_regex = ["_test\\.go"]
  delay = 500
  send_interrupt = true
  kill_delay = "1s"

[log]
  time = true

[misc]
  clean_on_exit = true
